<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Arigato</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="/favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>

<body>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #pieru {
            position: absolute;
            left: 50vw;
            top: 5vh;
            transform: translateX(-50%);
            writing-mode: vertical-lr;
            text-orientation: upright;
            font-family: 'Meiryo';
            font-size: 16vh;
            margin: 0;
            text-align: center;
            color: rgb(255, 0, 0);
        }
    
        #rond {
            position: absolute;
            top: 75vh; left: 0;
        }
    </style>
    
    <h1 id="pieru">ピエール</h1>
    
    <svg viewBox="0 0 100 100" id="rond" fill="rgb(255, 0, 0)">
        <circle cx="50" cy="50" r="50" />
    </svg>
    
</body>
</html>
